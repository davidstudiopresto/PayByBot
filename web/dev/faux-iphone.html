<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Faux iPhone · PayByBot</title>
<style>
  :root { --screen-w: 393px; --screen-h: 852px; }
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; overflow: hidden; display: grid; place-items: center; background: #e9eaee; font-family: -apple-system, system-ui, sans-serif; }
  .phone {
    position: absolute; top: 50%; left: 50%; transform-origin: center; width: calc(var(--screen-w) + 28px); height: calc(var(--screen-h) + 28px);
    padding: 14px; border-radius: 66px; background: #1c1c1e;
    box-shadow: 0 0 0 2px #3a3a3c, 0 40px 80px -30px rgb(0 0 0 / .45);
  }
  .screen { position: relative; width: 100%; height: 100%; border-radius: 52px; overflow: hidden; background: #f9f9f9; display: flex; flex-direction: column; }
  .status { height: 54px; flex: none; display: flex; align-items: center; justify-content: space-between; padding: 6px 34px 0; font-weight: 600; font-size: 16px; color: #111; background: #f9f9f9; }
  .island { position: absolute; top: 11px; left: 50%; transform: translateX(-50%); width: 124px; height: 36px; border-radius: 20px; background: #000; z-index: 2; }
  iframe { flex: 1; width: 100%; border: 0; background: #f9f9f9; }
  .safari { flex: none; height: 92px; background: rgb(249 249 249 / .96); border-top: 1px solid #ddd; padding: 8px 14px 0; }
  .url { height: 40px; border-radius: 12px; background: #e3e3e8; display: grid; place-items: center; font-size: 15px; color: #111; }
  .bar { display: flex; justify-content: space-between; padding: 8px 18px 0; color: #0a84ff; }
  .bar svg { width: 24px; height: 24px; }
  .bar .off { color: #b5b5bb; }
  .safari26 { flex: none; height: 92px; display: flex; align-items: flex-start; gap: 8px; padding: 10px 18px 0; background: #f9f9f9; }
  .pill { height: 44px; border-radius: 22px; background: #fff; box-shadow: 0 2px 10px rgb(0 0 0 / .12); display: grid; place-items: center; font-size: 16px; color: #111; }
  .nav { width: 78px; font-size: 22px; }
  .url26 { flex: 1; }
  .more { width: 44px; font-size: 11px; letter-spacing: 1px; }
  .home { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); width: 134px; height: 5px; border-radius: 3px; background: #111; }
</style>
</head>
<body>
  <div class="phone">
    <div class="screen">
      <div class="island"></div>
      <div class="status"><span>9:41</span><span>5G ▮</span></div>
      <iframe src="/#demo" title="PayByBot sur iPhone"></iframe>
      <!-- Safari 26: back/forward, the address, and « ⋯ » bottom right (as on a real iPhone) -->
      <div class="safari26">
        <span class="pill nav">‹ &nbsp; ›</span>
        <span class="pill url26">paybybot.fr</span>
        <span class="pill more">•••</span>
      </div>
      <div class="home"></div>
    </div>
  </div>
<script>
  // The whole phone always fits the window (scaled down when the window is shorter).
  const fit = () => (document.querySelector('.phone').style.transform = `translate(-50%, -50%) scale(${Math.min(1, (innerHeight - 24) / 880, (innerWidth - 24) / 421)})`)
  addEventListener('resize', fit)
  fit()
</script>
</body>
</html>
